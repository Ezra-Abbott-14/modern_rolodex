<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rolodexi</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <div class="eyebrow">PERSONAL CONTACT ARCHIVE · EST. 2026</div>
          <h1>Rolodexi <span class="title-note">personal edition</span></h1>
        </div>

        <div class="top-actions">
          <button class="ghost" id="exportBtn">Export cards</button>
          <button class="primary" id="addBtn">＋ Add person</button>
        </div>
      </header>

      <section class="rolodex" aria-label="Digital Rolodex">
        <aside class="index-panel">
          <nav class="index" id="index" aria-label="Last name index"></nav>
          <div class="index-hint">Scroll the deck<br />or use ← →</div>
        </aside>

        <section class="machine">
          <div class="machine-hardware" aria-hidden="true">
            <span class="side-wheel wheel-left"></span>
            <span class="side-wheel wheel-right"></span>
            <span class="side-leg leg-left"></span>
            <span class="side-leg leg-right"></span>
            <span class="axle"></span>
          </div>

          <div class="machine-top">
            <span class="machine-brand">
              ROLODEXI
            </span>

            <label class="search">
              <span aria-hidden="true">⌕</span>
              <input id="search" type="search" placeholder="Find a person..." />
            </label>

            <span class="count" id="count" aria-live="polite"></span>
          </div>

          <div class="deck-window" id="deckWindow">
            <div class="card-stack" id="cardStack"></div>
            <div class="spindle" aria-hidden="true"><span></span><b></b></div>
          </div>

          <div class="deck-controls">
            <span class="control-prong" aria-hidden="true"></span>
            <button class="flip" id="prevBtn">← Previous</button>
            <div class="deck-position" id="position" aria-live="polite"></div>
            <button class="flip" id="nextBtn">Next →</button>
            <span class="control-prong" aria-hidden="true"></span>
          </div>
        </section>
      </section>

    </main>

    <dialog id="personDialog">
      <form class="modal" id="personForm">
        <h2>Add a new card</h2>

        <div class="form-grid">
          <label>
            Full name
            <input name="name" required placeholder="e.g. Avery Chen" />
          </label>

          <label>
            Role / company
            <input name="role" placeholder="e.g. Designer at..." />
          </label>

          <label>
            Where you met
            <input name="met" placeholder="e.g. Saturday market" />
          </label>

          <label>
            City
            <input name="city" placeholder="e.g. Portland, OR" />
          </label>

          <label>
            Phone
            <input name="phone" placeholder="(555) 123-4567" />
          </label>

          <label>
            Email
            <input name="email" type="email" placeholder="hello@example.com" />
          </label>

          <label class="field full">
            Notes
            <textarea name="notes" placeholder="What should you remember for next time?"></textarea>
          </label>

          <label class="field full">
            Tags
            <input name="tags" placeholder="design, coffee, local (comma separated)" />
          </label>
        </div>

        <div class="modal-actions">
          <button type="button" class="ghost" id="cancelBtn">Cancel</button>
          <button class="primary">Save card</button>
        </div>
      </form>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
