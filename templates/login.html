<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in · Rolodexi</title><link rel="stylesheet" href="/styles.css"></head>
<body><main class="app"><section class="auth-card">
  <div class="eyebrow">ROLODEXI · PRIVATE DEMO</div>
  <h1>Welcome back.</h1>
  <p>Enter the demo access code shared by your team. You do not need a Gemini API key.</p>
  <form method="post" action="/login">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Demo access code<input name="access_code" type="password" required maxlength="256" autocomplete="current-password" autofocus></label>
    {% if error %}<p role="alert">{{ error }}</p>{% endif %}
    <button class="primary" type="submit">Open Rolodexi</button>
  </form>
</section></main></body></html>
