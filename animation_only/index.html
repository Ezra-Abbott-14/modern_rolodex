<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rolodexi — Opening Animation</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="animation-lock">
    <section class="intro" id="introLoader" role="status" aria-label="Loading Rolodexi">
      <div class="wordmark" aria-label="Rolodexi">
        <span>R</span><span>O</span><span>L</span><span>O</span><span>D</span><span>E</span><span>X</span><span>I</span>
      </div>
      <p class="intro-note">A living directory for the people, places, and details worth returning to.</p>
    </section>

    <main class="animation-stage" aria-label="Rolodexi animation end state">
      <div class="final-wordmark" aria-label="Rolodexi"><span>R</span>OLODEXI</div>
      <p class="stage-note">Opening animation complete.</p>
    </main>

    <script type="module" src="script.js"></script>
  </body>
</html>
